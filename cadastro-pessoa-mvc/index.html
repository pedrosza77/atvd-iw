<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pessoa - MVC</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Pessoa (MVC)</h1>
        <form id="pessoaForm">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>

            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" required>

            <label for="anoNascimento">Ano de Nascimento:</label>
            <input type="number" id="anoNascimento" required>

            <button type="button" id="btnCalcular">Calcular Idade</button>
        </form>

        <div id="resultado"></div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
